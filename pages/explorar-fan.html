<!-- F01b · Explorar. Los resultados los pone js/app.js. -->
<div class="pantalla pantalla--con-navegacion">
  <div class="atmosfera atmosfera--superior" aria-hidden="true"></div>

  <div class="pantalla__contenido">
    <header class="barra-marca">
      <span class="barra-marca__logo">
        <img class="logo logo--blanco" src="../assets/logo-firma-blanco.svg" alt="Looped">
        <img class="logo logo--negro" src="../assets/logo-firma-negro.svg" alt="Looped">
      </span>
      <div class="barra-marca__acciones">
        <button type="button" class="boton-icono boton-icono--relleno" aria-label="Cambiar a modo claro" data-cambiar-tema>
          <svg class="icono" aria-hidden="true"><use href="#icono-tema"></use></svg>
        </button>
        <a class="avatar" href="perfil-fan.html" aria-label="Tu perfil" data-avatar-sesion></a>
      </div>
    </header>

    <main>
      <div class="encabezado-pagina">
        <h1 class="titulo titulo--medio">Explorar</h1>
      </div>

      <div class="explorar__busqueda" role="search">
        <label class="buscador">
          <svg class="icono" aria-hidden="true"><use href="#icono-buscar"></use></svg>
          <input type="search" placeholder="Buscar artistas" aria-label="Buscar artistas" autocomplete="off" enterkeyhint="search" data-busqueda>
          <button type="button" class="boton-icono boton-icono--pequeno" aria-label="Borrar búsqueda" hidden data-borrar-busqueda>
            <svg class="icono icono--pequeno" aria-hidden="true"><use href="#icono-cerrar"></use></svg>
          </button>
        </label>
        <div class="desplegable">
          <button type="button" class="boton-icono boton-icono--relleno" aria-label="Filtros" aria-haspopup="true"
            aria-expanded="false" aria-controls="menu-filtros" data-abrir-filtros>
            <svg class="icono" aria-hidden="true"><use href="#icono-filtro"></use></svg>
          </button>
          <!-- Las opciones las pone js/app.js -->
          <div class="menu" id="menu-filtros" role="menu" aria-label="Filtros" hidden data-menu-filtros></div>
        </div>
      </div>

      <div class="explorar__filtro-activo" hidden data-filtro-activo>
        <span class="etiqueta etiqueta--acento" data-nombre-filtro></span>
        <button type="button" class="enlace" data-quitar-filtro>Quitar filtro</button>
      </div>

      <div aria-live="polite" data-resultados></div>
    </main>
  </div>

  <nav class="navegacion navegacion--adaptable pantalla__navegacion" aria-label="Navegación principal">
    <a class="navegacion__marca" href="inicio-fan.html" aria-label="Looped, ir al inicio">
      <img class="logo logo--blanco" src="../assets/logo-firma-blanco.svg" alt="">
      <img class="logo logo--negro" src="../assets/logo-firma-negro.svg" alt="">
    </a>
    <a class="navegacion__pestana" href="inicio-fan.html"><svg class="icono" aria-hidden="true"><use href="#icono-inicio"></use></svg><span>Inicio</span></a>
    <a class="navegacion__pestana" href="explorar-fan.html" aria-current="page"><svg class="icono" aria-hidden="true"><use href="#icono-explorar"></use></svg><span>Explorar</span></a>
    <a class="navegacion__pestana" href="comunidad-fan.html"><svg class="icono" aria-hidden="true"><use href="#icono-comunidad"></use></svg><span>Comunidad</span></a>
    <a class="navegacion__pestana" href="perfil-fan.html"><svg class="icono" aria-hidden="true"><use href="#icono-perfil"></use></svg><span>Perfil</span></a>
  </nav>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
