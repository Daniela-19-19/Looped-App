<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looped · Nueva contraseña</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icon-180.png">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-pantalla="nueva-contrasena">

<!-- Íconos de esta pantalla (copiados del sprite de componentes.html) -->
<svg width="0" height="0" aria-hidden="true" hidden>
  <defs>
    <symbol id="icono-atras" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="icono-ver" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5.5c-4.6 0-8 3.4-9.4 5.6a1.7 1.7 0 0 0 0 1.8C4 15.1 7.4 18.5 12 18.5s8-3.4 9.4-5.6a1.7 1.7 0 0 0 0-1.8C20 8.9 16.6 5.5 12 5.5zm0 10a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></symbol>
    <symbol id="icono-ocultar" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 6.1A9.6 9.6 0 0 1 12 6c4.4 0 7.4 3.2 8.6 5.2.3.5.3 1.1 0 1.6-.5.8-1.2 1.8-2.2 2.7M6.3 7.6c-1.6 1.1-2.7 2.5-3.3 3.6-.3.5-.3 1.1 0 1.6C4.2 14.8 7.4 18 12 18c1.6 0 3-.4 4.2-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  </defs>
</svg>

<!-- A02c · Nueva contraseña (decisión 14): aquí llega el link del correo. -->
<div class="pantalla">
  <div class="atmosfera atmosfera--lateral" aria-hidden="true"></div>

  <header class="barra-superior">
    <a class="boton-icono" href="iniciar-sesion.html" aria-label="Volver a iniciar sesión">
      <svg class="icono" aria-hidden="true"><use href="#icono-atras"></use></svg>
    </a>
    <span></span>
    <span></span>
  </header>

  <main class="pantalla__contenido">
    <p class="texto texto--suave" data-estado-cargando>Revisando tu link…</p>

    <div data-estado-formulario hidden>
      <div class="encabezado-pagina">
        <h1 class="titulo" id="titulo-formulario" tabindex="-1">Crea tu nueva contraseña.</h1>
        <p class="encabezado-pagina__bajada">Con ella entrarás a Looped desde ahora.</p>
      </div>
      <form id="formulario-nueva" novalidate>
      <div class="campo" data-campo="contrasena">
        <label class="campo__etiqueta" for="contrasena">Contraseña nueva</label>
        <div class="campo__grupo">
          <input class="campo__control" id="contrasena" name="contrasena" type="password" placeholder="Crea tu contraseña"
            autocomplete="new-password" aria-describedby="ayuda-contrasena error-contrasena">
          <button type="button" class="boton-icono boton-icono--relleno campo__boton" aria-label="Mostrar contraseña" data-mostrar-contrasena>
            <svg class="icono" aria-hidden="true"><use href="#icono-ver"></use></svg>
          </button>
        </div>
        <p class="campo__ayuda" id="ayuda-contrasena">Usa al menos 6 caracteres.</p>
        <p class="campo__mensaje-error" id="error-contrasena" role="alert"></p>
      </div>
      <div class="campo" data-campo="repetir">
        <label class="campo__etiqueta" for="repetir">Repite la contraseña</label>
        <div class="campo__grupo">
          <input class="campo__control" id="repetir" name="repetir" type="password" placeholder="Escríbela otra vez"
            autocomplete="new-password" aria-describedby="error-repetir">
          <button type="button" class="boton-icono boton-icono--relleno campo__boton" aria-label="Mostrar contraseña" data-mostrar-contrasena>
            <svg class="icono" aria-hidden="true"><use href="#icono-ver"></use></svg>
          </button>
        </div>
        <p class="campo__mensaje-error" id="error-repetir" role="alert"></p>
      </div>
      </form>
    </div>

    <div data-estado-vencido hidden>
      <div class="encabezado-pagina">
        <h1 class="titulo" id="titulo-vencido" tabindex="-1">Este link ya no sirve.</h1>
        <p class="encabezado-pagina__bajada">Puede que haya vencido o que ya lo hayas usado. Pide otro y ábrelo apenas te llegue.</p>
      </div>
    </div>
  </main>

  <footer class="pantalla__pie">
    <button type="submit" class="boton boton--bloque" form="formulario-nueva" data-boton-guardar hidden>Guardar contraseña</button>
    <a class="boton boton--bloque" href="recuperar-contrasena.html" data-pedir-otro hidden>Pedir otro link</a>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
