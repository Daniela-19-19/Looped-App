<!doctype html>
<html lang="es" data-rol="artista">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looped · Publicar lanzamiento</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/icon-180.png">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-pantalla="publicar-lanzamiento-artista">

<!-- Íconos de esta pantalla (copiados del sprite de componentes.html) -->
<svg width="0" height="0" aria-hidden="true" hidden>
  <defs>
    <symbol id="icono-atras" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="icono-audio" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></symbol>
    <symbol id="icono-imagen" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="10" r="1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 16l-4.5-4.5L7 20"/></symbol>
  </defs>
</svg>

<!-- R03 · Publicar lanzamiento -->
<div class="pantalla">
  <header class="barra-superior">
    <a class="boton-icono" href="musica-artista.html" aria-label="Volver a tu música">
      <svg class="icono" aria-hidden="true"><use href="#icono-atras"></use></svg>
    </a>
    <span class="barra-superior__titulo">Publicar lanzamiento</span>
    <span></span>
  </header>

  <main class="pantalla__contenido">
    <div class="encabezado-pagina">
      <h1 class="titulo titulo--medio">Dale espacio a tu música.</h1>
      <p class="encabezado-pagina__bajada">Tu lanzamiento entra en la ventana de 48 horas.</p>
    </div>

    <form id="formulario-lanzamiento" novalidate>
      <div class="campo" data-campo="nombre-lanzamiento">
        <label class="campo__etiqueta" for="nombre-lanzamiento">Nombre del lanzamiento</label>
        <input class="campo__control" id="nombre-lanzamiento" type="text" maxlength="60"
          placeholder="Cómo se llama" aria-describedby="error-nombre-lanzamiento">
        <p class="campo__mensaje-error" id="error-nombre-lanzamiento" role="alert"></p>
      </div>

      <div class="campo" data-campo="nombre-cancion">
        <label class="campo__etiqueta" for="nombre-cancion">Nombre de la canción</label>
        <input class="campo__control" id="nombre-cancion" type="text" maxlength="60"
          placeholder="Cómo se llama tu canción" aria-describedby="error-nombre-cancion">
        <p class="campo__mensaje-error" id="error-nombre-cancion" role="alert"></p>
      </div>

      <!-- Audio: obligatorio -->
      <div class="campo publicar__archivo" data-campo="audio">
        <section class="tarjeta" aria-labelledby="titulo-audio">
          <div class="tarjeta__cabecera">
            <svg class="icono" aria-hidden="true"><use href="#icono-audio"></use></svg>
            <div>
              <h2 class="rotulo" id="titulo-audio" data-titulo-audio>Audio</h2>
              <p class="tarjeta__texto" data-detalle-audio>MP3, M4A, WAV u OGG. Hasta 25 MB.</p>
            </div>
          </div>
          <div class="tarjeta__acciones">
            <button type="button" class="boton boton--secundario boton--bloque" data-elegir-audio>Seleccionar audio</button>
            <button type="button" class="boton boton--secundario boton--bloque" hidden data-escuchar-audio>Escuchar</button>
            <button type="button" class="boton boton--terciario boton--bloque" data-audio-muestra>Usar audio de muestra</button>
          </div>
          <input type="file" accept="audio/*" hidden data-entrada-audio>
        </section>
        <p class="campo__mensaje-error" role="alert" data-error-audio></p>
      </div>

      <!-- Portada: opcional -->
      <section class="tarjeta publicar__archivo" aria-labelledby="titulo-portada">
        <div class="tarjeta__cabecera">
          <span data-miniatura-portada><svg class="icono" aria-hidden="true"><use href="#icono-imagen"></use></svg></span>
          <div>
            <h2 class="rotulo" id="titulo-portada">Portada</h2>
            <p class="tarjeta__texto" data-detalle-portada>Opcional. Imagen cuadrada.</p>
          </div>
        </div>
        <div class="tarjeta__acciones">
          <button type="button" class="boton boton--secundario boton--bloque" data-elegir-portada>Seleccionar portada</button>
        </div>
        <input type="file" accept="image/*" hidden data-entrada-portada>
      </section>

      <button type="submit" class="boton boton--bloque publicar__enviar" data-publicar>Publicar lanzamiento</button>
    </form>
  </main>

  <!-- Avisos flotantes (p. ej. «El audio supera 25 MB») -->
  <div class="pantalla__avisos" aria-live="polite" data-avisos></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
