  <div class="pantalla__contenido">

      <a class="boton-icono" href="inicio-fan.html" aria-label="Volver" data-volver>

      </a>
      <span class="barra-superior__titulo">Comunidad</span>
      <span></span>
    </header>

    <main class="comunidad" data-comunidad>
      <!-- Se ve solo si el artista no existe. -->
      <div class="encabezado-pagina">
        <h1 class="titulo titulo--medio">Este artista no está disponible.</h1>
        <p class="encabezado-pagina__bajada"><a class="enlace" href="explorar-fan.html">Explorar artistas</a></p>
      </div>
    </main>
  </div>
