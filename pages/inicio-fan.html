<!-- F01a · Inicio del fan. Los datos los pone js/app.js. -->
<div class="pantalla pantalla--con-navegacion">
  <div class="atmosfera atmosfera--superior" aria-hidden="true"></div>

  <div class="pantalla__contenido">
    <header class="barra-marca">
      <span>
        <img class="logo logo--blanco" src="../assets/logo-firma-blanco.svg" alt="Looped">
        <img class="logo logo--negro" src="../assets/logo-firma-negro.svg" alt="Looped">
      </span>
      <div class="barra-marca__acciones">
        <button type="button" class="boton-icono boton-icono--relleno" aria-label="Cambiar a modo claro" data-cambiar-tema>
          <svg class="icono" aria-hidden="true"><use href="#icono-tema"></use></svg>
        </button>
        <a class="avatar" href="perfil-fan.html" aria-label="Tu perfil" data-avatar-sesion></a>
      </div>
    </header>

    <main>
      <div class="encabezado-pagina">
        <h1 class="titulo titulo--medio">Descubre algo nuevo</h1>
        <p class="encabezado-pagina__bajada">Lanzamientos y artistas que vale la pena conocer.</p>
        <nav class="chips inicio__atajos" aria-label="Atajos">
          <a class="chip" href="conexion-activa-fan.html">Conexión activa</a>
          <a class="chip" href="nuevos-lanzamientos-fan.html">Nuevos lanzamientos</a>
        </nav>
      </div>

      <section class="inicio__seccion" aria-labelledby="titulo-destacado" data-seccion-destacado>
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-destacado" data-titulo-destacado>En sus primeras 48 h</h2>
          <a class="enlace" href="nuevos-lanzamientos-fan.html">Ver más</a>
        </div>
        <div data-destacado></div>
      </section>

      <section class="inicio__seccion" aria-labelledby="titulo-conexion" data-seccion-conexion>
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-conexion">Una conexión real</h2>
          <a class="enlace" href="conexion-activa-fan.html">Conocer</a>
        </div>
        <div data-conexion></div>
      </section>

      <section class="inicio__seccion" aria-labelledby="titulo-tus-preguntas">
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-tus-preguntas">Tus preguntas</h2>
          <a class="enlace" href="perfil-fan.html" data-ver-todas-preguntas>Ver todas</a>
        </div>
        <div data-tus-preguntas></div>
      </section>

      <section class="inicio__seccion" aria-labelledby="titulo-explora">
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-explora">Explora a tu manera</h2>
          <a class="enlace" href="explorar-fan.html">Explorar</a>
        </div>
        <!-- Filtros de la lista «Artistas»: los dibuja js/app.js -->
        <div class="chips" role="group" aria-label="Filtrar artistas" data-filtros-artistas></div>
      </section>

      <section class="inicio__seccion" aria-labelledby="titulo-artistas">
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-artistas">Artistas</h2>
        </div>
        <div aria-live="polite" data-lista-artistas></div>
      </section>

      <section class="inicio__seccion" aria-labelledby="titulo-canciones">
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-canciones">Canciones</h2>
        </div>
        <div class="tarjeta" data-lista-canciones></div>
      </section>

      <section class="inicio__seccion" aria-labelledby="titulo-recorrido">
        <div class="encabezado-seccion">
          <h2 class="encabezado-seccion__titulo" id="titulo-recorrido">Tu recorrido</h2>
