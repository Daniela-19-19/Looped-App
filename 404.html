<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looped · Página no encontrada</title>
  <!-- Rutas que empiezan con «/»: esta página puede salir en cualquier dirección. -->
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-pantalla="no-encontrada">

<!-- 404 · Página no encontrada (decisión 14). Misma composición que la bienvenida. -->
<main class="pantalla bienvenida">
  <div class="atmosfera atmosfera--inferior" aria-hidden="true"></div>
  <div class="pantalla__contenido">
    <div class="bienvenida__logo">
      <img class="logo logo--medio logo--blanco" src="/assets/logo-firma-blanco.svg" alt="Looped">
      <img class="logo logo--medio logo--negro" src="/assets/logo-firma-negro.svg" alt="Looped">
    </div>
    <h1 class="titulo bienvenida__titulo">No encontramos esta página.</h1>
    <p class="texto--pequeno texto--suave bienvenida__bajada">Puede que el link esté mal escrito o que ya no exista.</p>
    <div class="bienvenida__acciones">
      <a class="boton boton--bloque" href="/">Ir a Looped</a>
    </div>
  </div>
</main>

<!-- Solo para aplicar la apariencia guardada (clara u oscura). -->
<script src="/js/app.js"></script>
</body>
</html>
